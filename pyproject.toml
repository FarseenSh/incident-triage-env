[project]
name = "incident-triage-env"
version = "0.1.0"
description = "Incident Response Triage Environment for OpenEnv — SRE agents diagnose and remediate production incidents"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.1",
    "fastmcp>=2.0.0",
    "uvicorn>=0.24.0",
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
include = ["server*", "scenarios*", "simulation*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
